<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direct Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 1.35rem;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="url"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="url"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #0369a1;
    }

    .status {
      font-size: 0.85rem;
      margin-bottom: 14px;
      min-height: 20px;
      color: #cbd5e1;
      word-break: break-all;
    }

    .status.error {
      color: #f87171;
    }

    .status.success {
      color: #38bdf8;
    }

    .player-wrap {
      width: 100%;
      background: #020617;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: none;
    }

    video {
      width: 100%;
      max-height: 70vh;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Direct Video Player</h1>
    <p class="subtitle">
      Paste a link  
    </p>

    <form id="videoForm" class="input-row">
      <input
        id="urlInput"
        type="url"
        placeholder="Paste video page URL here..."
        required
      />
      <button type="submit">Play</button>
    </form>

    <div id="status" class="status"></div>

    <div id="playerWrap" class="player-wrap">
      <video id="videoPlayer" controls playsinline autoplay></video>
    </div>
  </div>

  <script>
    const form = document.getElementById("videoForm");
    const urlInput = document.getElementById("urlInput");
    const statusEl = document.getElementById("status");
    const playerWrap = document.getElementById("playerWrap");
    const videoPlayer = document.getElementById("videoPlayer");

    let fallbackUrl = null;

    function parseVideoUrl(rawUrl) {
      const parsed = new URL(rawUrl.trim());

      // Remove leading "www." if present (www.domain.com -> domain.com)
      const domain = parsed.hostname.replace(/^www\./i, "");

      // Split path by "/" and remove empty segments
      const segments = parsed.pathname.split("/").filter(Boolean);

      // Find segment right after "videos", or fall back to the first numeric segment
      let videoId = null;
      const videosIndex = segments.findIndex((seg) => seg.toLowerCase() === "videos");
      if (videosIndex !== -1 && segments[videosIndex + 1]) {
        videoId = segments[videosIndex + 1];
      } else {
        videoId = segments.find((seg) => /^\d+$/.test(seg));
      }

      if (!videoId || !/^\d+$/.test(videoId)) {
        throw new Error("Could not find a numeric video ID in the URL.");
      }

      const primaryUrl = `${parsed.protocol}//${domain}/contents/videos/0/${videoId}/${videoId}.mp4`;

      // Optional bucket fallback (e.g., ID 1788 -> folder 1000) if /0/ returns 404
      const bucket = Math.floor(Number(videoId) / 1000) * 1000;
      const altUrl =
        bucket !== 0
          ? `${parsed.protocol}//${domain}/contents/videos/${bucket}/${videoId}/${videoId}.mp4`
          : null;

      return { primaryUrl, altUrl };
    }

    function loadVideo(src) {
      playerWrap.style.display = "block";
      videoPlayer.src = src;
      videoPlayer.load();
      videoPlayer.play().catch(() => {
        // Autoplay might be blocked by browser policy; user can press play manually
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      fallbackUrl = null;

      try {
        const { primaryUrl, altUrl } = parseVideoUrl(urlInput.value);
        fallbackUrl = altUrl;

        statusEl.className = "status success";
        statusEl.textContent = `Loading: ${primaryUrl}`;
        loadVideo(primaryUrl);
      } catch (err) {
        playerWrap.style.display = "none";
        videoPlayer.removeAttribute("src");
        statusEl.className = "status error";
        statusEl.textContent = err.message || "Invalid URL.";
      }
    });

    videoPlayer.addEventListener("error", () => {
      if (fallbackUrl) {
        const nextUrl = fallbackUrl;
        fallbackUrl = null;
        statusEl.className = "status success";
        statusEl.textContent = `Not found in /0/, trying bucket folder: ${nextUrl}`;
        loadVideo(nextUrl);
        return;
      }

      statusEl.className = "status error";
      statusEl.textContent =
        "Failed to load video. The file may not exist at that path or the host blocks external playback.";
    });
  </script>
</body>
</html>
